<!-- HTML shell: React mounts into #root; Vite processes the module entry point. -->
<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#0b0d10" />
		<!-- Apply the saved palette before the first paint to avoid a light flash. -->
		<script>
			try {
				const theme =
					localStorage.getItem("fieldnotes.theme") === "light"
						? "light"
						: "dark";
				document.documentElement.dataset.theme = theme;
				document
					.querySelector('meta[name="theme-color"]')
					.setAttribute("content", theme === "dark" ? "#0b0d10" : "#f7f7fa");
			} catch {
				/* Storage is optional; the HTML/CSS defaults remain dark. */
			}
		</script>
		<title>Fieldnotes | Notes Dashboard</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
